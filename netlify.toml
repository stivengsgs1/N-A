# Plain static site: no framework, no package manager, no build step.
# The HTML page and its assets live at the repository root and are published as-is.
[build]
  publish = "."
  command = ""

# The site has no index.html, so serve the main page at the root URL.
[[redirects]]
  from = "/"
  to = "/marca_personal_profesional.html"
  status = 200
